- name: Zyli
  tagline: A next-generation conversational AI voice agent built with Flutter, Clean Architecture, WebRTC, and hardware Echo Cancellation.
  description: Real-time bidirectional conversational AI mobile application built with Flutter adhering to Clean Architecture principles. Features WebRTC peer-to-peer audio streaming, WebSocket signaling, hardware Acoustic Echo Cancellation (AEC), animated glassmorphic audio visualizers, and hardware-encrypted security.
