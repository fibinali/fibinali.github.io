# Projects showcase. Each entry gets a card on /projects/ AND its own detail
# page at /projects/<slug>/ (the slug is the name, lowercased and hyphenated).
#
# Required:  name, description, tech, filters, status, github
# Optional:
#   demo         — live URL; omit or leave "" if there isn't one
#   featured     — true puts it in the homepage "Featured project" slot
#   preview      — terminal-style lines shown only in the homepage feature slot
#   tagline      — a longer one-liner for the detail page header (falls back
#                  to `description` if omitted)
#   highlights   — a short bullet list of standout features, shown on the
#                  detail page under a checkmark list
#   screenshots  — a gallery of images for the detail page. Each item is
#                  either a plain path string or {src, alt}. Paths are
#                  relative to the site root, so drop your own image at
#                  e.g. static/assets/img/projects/<slug>/1.png and
#                  reference it here as assets/img/projects/<slug>/1.png.
#
# filters: any of  ai | cybersecurity | flutter | backend | web
# status:  Active | Completed | Experimental | Archived
#
# For a longer write-up than fits in `description`, add a Markdown file at
# content/projects/<slug>.md (plain Markdown, no front matter needed).
# It renders below the gallery on the detail page automatically if present.

- name: Stavoya
  tagline: A comprehensive PropTech mobile rental and hotel booking platform engineered with Flutter, Clean Architecture, BLoC, and Stripe.
  description: Modern PropTech mobile rental application built with Flutter strictly following Clean Architecture principles (domain, data, presentation). Features BLoC state management, Google Maps discovery, Stripe payments, dynamic pricing calculations, stay extensions, and deep linking.
  tech:
    - Flutter
    - Dart
    - Clean Architecture
    - BLoC
    - Stripe
    - Google Maps
    - REST API
    - Firebase
  filters:
    - flutter
  status: Completed
  github: ""
  demo: ""
  featured: true
  preview:
    - "$ stavoya --inspect-architecture"
    - "Flutter 3.x (Dart ^3.12.2) · Clean Architecture (Domain, Data, Presentation)"
    - "State: BLoC (flutter_bloc) · DI: Hybrid GetIt + GetX"
    - "Features: Dynamic pricing, Google Maps, Stripe Checkout, Deep Links"
  highlights:
    - "Strict Clean Architecture structure across 30+ domain use cases, entities, and repository contracts"
    - "Hybrid dependency injection using GetIt for UI BLoCs and GetX for lazy-loading domain use cases"
    - "Full PropTech booking engine with dynamic pricing calculations, wishlists, and stay extensions"
    - "In-app Stripe mobile SDK integration with payment sheet checkout and digital invoice generation"
    - "Interactive Google Maps property discovery, Firebase push notifications, and global deep linking"

- name: Aigosys
  tagline: A student-centric mobile education platform built with Flutter, Clean Architecture, BLoC, and Cloudflare Stream.
  description: Company cross-platform mobile learning application built with Flutter adhering to Clean Architecture principles (data, domain, presentation). Features BLoC state management, secure Cloudflare Stream video delivery, interactive timed quizzes, Firebase push notifications, and resilient Dio networking.
  tech:
    - Flutter
    - Dart
    - Clean Architecture
    - BLoC
    - Cloudflare Stream
    - Dio
    - Firebase
    - Go REST API
  filters:
    - flutter
  status: Active
  github: ""
  demo: ""
  featured: false
  preview:
    - "$ aigosys --architecture"
    - "Flutter 3.x (Dart ^3.12.2) · Clean Architecture"
    - "State: BLoC · Video: Cloudflare Stream"
    - "Network: Dio + CookieJar · Cloud: Firebase FCM"
  highlights:
    - "Strict Clean Architecture layer separation: data (Dio, models), domain (pure Dart usecases), and presentation (BLoC)"
    - "Optimized video streaming engine powered by Cloudflare Stream with custom mobile player controls"
    - "Multi-format curriculum engine: Article Reader, interactive timed quizzes, and course review sheets"
    - "Real-time student progress tracking and learning analytics synchronized with a Go backend"
    - "Full Firebase push notifications (FCM) and deep linking via app_links for seamless web-to-app routing"
    - "Production network resilience with dedicated fallback screens for 500 server errors and offline states"
