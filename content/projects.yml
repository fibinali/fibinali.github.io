    - "Backend: Go REST API · Cloud: Firebase FCM"
    - "Phase 1: Completed · Development: Active"
  highlights:
    - "Structured modular course delivery with interactive lessons, video streaming, and study resources"
    - "Interactive timed quiz and assessment engine with instantaneous score calculation and review modes"
    - "Real-time student progress tracking and learning analytics synchronized with a Go backend"
    - "Firebase Cloud Messaging (FCM) integration for assignment reminders, exam alerts, and announcements"
    - "Deep linking navigation allowing students to open specific courses and quizzes directly from push notifications"
