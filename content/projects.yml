- name: Where Money Goes
  tagline: A cross-platform personal finance & expense manager built with Flutter, Clean Architecture, BLoC, and Firebase.
  description: Personal finance and expense management mobile application engineered with Flutter and Firebase. Features Clean Architecture, flutter_bloc unidirectional state management, declarative go_router navigation, fl_chart analytics visualizations, and real-time Cloud Firestore cloud sync.
  tech:
    - Flutter
    - Dart
    - Clean Architecture
    - BLoC
    - Firebase Auth
    - Cloud Firestore
    - go_router
    - get_it
    - fl_chart
  filters:
    - flutter
  status: Completed
  github: ""
  demo: ""
  featured: false
  preview:
    - "$ where-money-goes --status"
    - "Flutter SDK ^3.12.2 · Clean Architecture"
    - "State: flutter_bloc (^9.1.1) + equatable (^2.0.7)"
    - "Routing: go_router (^16.1.0) · DI: get_it (^8.2.0)"
    - "Backend: Cloud Firestore · Charts: fl_chart"
  highlights:
    - "Strict Clean Architecture layer decoupling across presentation, domain, and data layers"
    - "Unidirectional data flow (UDF) powered by flutter_bloc with Equatable value equality"
    - "Declarative routing with go_router including authentication redirects and nested shell navigation"
    - "Decoupled dependency injection utilizing get_it service locator with singletons and factories"
    - "Real-time multi-device cloud synchronization with Cloud Firestore snapshot listeners"
    - "Interactive expense and cash flow data visualizations powered by fl_chart (pie and trend charts)"
    - "Strict server-side Cloud Firestore security rules enforcing complete user-level data isolation"
